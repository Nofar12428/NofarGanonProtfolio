<script type="text/x-dc" data-dc-script data-props='{"show":{"editor":"enum","options":["all","night","sunset","morning"],"default":"all"},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { show: null };
  }
  renderVals() {
    const show = this.state.show || this.props.show || 'all';
    const R = [
      { id: 'night', time: 'NIGHT', col: '#C6FF4A', len: '1.5 KM', from: 'The party', to: 'Home', stats: [[5, 'TURNS'], [4, 'LIGHTS'], [3, 'CROSSWALKS'], [2, 'ROUNDABOUTS']] },
      { id: 'sunset', time: 'EVENING', col: '#FF8A5B', len: '900 M', from: 'Dana’s place', to: 'Noa’s place', stats: [[3, 'TURNS'], [3, 'LIGHTS'], [2, 'CROSSWALKS'], [1, 'OBSTACLE']] },
      { id: 'morning', time: 'MORNING', col: '#7CC4FF', len: '1.2 KM', from: 'Your place', to: 'The office', stats: [[4, 'TURNS'], [4, 'LIGHTS'], [1, 'ROUNDABOUT'], [3, 'OBSTACLES']] }
    ];
    const vis = (id) => show === 'all' || show === id;
    const out = {};
    R.forEach((r) => { out['op_' + r.id] = vis(r.id) ? 1 : 0.12; });
    const TABS = [['all', 'ALL'], ['night', 'NIGHT'], ['sunset', 'EVENING'], ['morning', 'MORNING']];
    out.tabs = TABS.map((t) => ({
      label: t[1], on: show === t[0] ? 'true' : 'false',
      bg: show === t[0] ? '#C6FF4A' : 'transparent', color: show === t[0] ? '#0B0E14' : '#F4F1EA',
      border: show === t[0] ? '#C6FF4A' : '#3A4558',
      pick: () => this.setState({ show: t[0] })
    }));
    out.cards = R.map((r) => ({
      time: r.time, col: r.col, len: r.len, from: r.from, to: r.to,
      stats: r.stats.map((s) => ({ n: s[0], label: s[1] })),
      op: vis(r.id) ? 1 : 0.35, edge: show === r.id ? r.col : '#262D3A'
    }));
    return out;
  }
}
</script>
