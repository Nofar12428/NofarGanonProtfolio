<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>End of simulation — drive report</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Archivo:wght@400;500;600;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #0B0E14; font-family: 'Archivo', sans-serif; color: #F4F1EA">

  <img src="{{bg}}" alt="" style="position: absolute; left: -20px; top: -20px; width: 1320px; height: 760px; object-fit: cover; filter: blur(7px) saturate(0.8)">
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(8,10,14,0.62)"></div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(8,10,14,0.2) 0%, rgba(8,10,14,0.85) 100%)"></div>

  <div style="position: absolute; left: 64px; top: 44px; display: flex; align-items: center; gap: 10px; height: 36px; box-sizing: border-box; padding: 0 16px 0 14px; border-radius: 999px; border: 1px solid rgba(244,241,234,0.75); background: rgba(8,10,14,0.55); font-size: 14px; font-weight: 500; letter-spacing: 0.04em">
    <span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 50%; background: #C6FF4A"></span>
    DRIVING SIMULATION
  </div>
  <div style="position: absolute; right: 72px; top: 44px; display: flex; gap: 10px; font-size: 12px; font-weight: 800; letter-spacing: 0.14em">
    <span style="height: 36px; display: flex; align-items: center; padding: 0 14px; border-radius: 999px; background: rgba(8,10,14,0.7); border: 1px solid rgba(244,241,234,0.3)">{{timeLabel}} DRIVE</span>
    <span style="height: 36px; display: flex; align-items: center; padding: 0 14px; border-radius: 999px; background: rgba(8,10,14,0.7); border: 1px solid rgba(244,241,234,0.3)">LEVEL {{levelText}}</span>
  </div>

  <div style="position: absolute; left: 72px; top: 104px; width: 1136px; display: flex; justify-content: space-between; align-items: flex-end">
    <div style="display: flex; flex-direction: column; gap: 14px">
      <h1 style="margin: 0; font-family: 'Anton', sans-serif; font-weight: 400; font-size: 76px; line-height: 0.95; letter-spacing: 0.02em; text-shadow: 5px 5px 0 rgba(0,0,0,0.6)">END OF THE ROAD<span style="color: #C6FF4A">.</span></h1>
      <div style="display: flex; flex-direction: column; gap: 6px; max-width: 640px">
        <span style="font-size: 26px; font-weight: 800; letter-spacing: 0.03em; color: {{band.color}}">{{band.title}}</span>
        <span style="font-size: 16px; line-height: 1.45; color: #E6E3DA">{{band.text}}</span>
      </div>
    </div>
  </div>

  <div role="group" aria-label="Drive report" style="position: absolute; left: 72px; top: 318px; width: 1136px; height: 270px; box-sizing: border-box; padding: 0 40px; border-radius: 40px; background: linear-gradient(to bottom, #161B25, #0C0F15); border: 1px solid rgba(244,241,234,0.18); box-shadow: inset 0 2px 0 rgba(244,241,234,0.06), 0 24px 60px rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: space-between">

    <sc-for list="{{leftDials}}" as="d" hint-placeholder-count="2">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 12px">
        <div style="position: relative; width: 168px; height: 168px">
          <div aria-hidden="true" style="position: absolute; inset: 0; border-radius: 50%; background: {{d.ring}}"></div>
          <div aria-hidden="true" style="position: absolute; inset: 12px; border-radius: 50%; background: #0E1219"></div>
          <div aria-hidden="true" style="position: absolute; inset: 18px; border-radius: 50%; background: repeating-conic-gradient(from 225deg, rgba(244,241,234,0.3) 0deg 1.5deg, transparent 1.5deg 27deg); -webkit-mask-image: radial-gradient(circle, transparent 86%, #000 87%); mask-image: radial-gradient(circle, transparent 86%, #000 87%)"></div>
          <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
            <span aria-hidden="true" style="width: 22px; height: 22px; color: {{d.lampColor}}; opacity: {{d.lampOp}}">
              <sc-if value="{{d.isTime}}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l3 2"></path><path d="M9 2h6"></path></svg></sc-if>
              <sc-if value="{{d.isWarn}}" hint-placeholder-val="{{ true }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"><path d="M12 3L2 20h20L12 3z"></path><path d="M12 10v4"></path><path d="M12 17h.01"></path></svg></sc-if>
            </span>
            <span style="font-family: 'Anton', sans-serif; font-size: {{d.size}}; line-height: 1.05; color: {{d.valueColor}}">{{d.value}}</span>
          </div>
        </div>
        <span style="font-size: 12px; font-weight: 800; letter-spacing: 0.2em; color: #9AA3B2">{{d.label}}</span>
      </div>
    </sc-for>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; margin-top: -6px">
      <div style="position: relative; width: 236px; height: 236px">
        <div aria-hidden="true" style="position: absolute; inset: 0; border-radius: 50%; background: {{scoreRing}}; box-shadow: 0 0 40px {{band.glow}}"></div>
        <div aria-hidden="true" style="position: absolute; inset: 16px; border-radius: 50%; background: #0B0E14"></div>
        <div aria-hidden="true" style="position: absolute; inset: 24px; border-radius: 50%; background: repeating-conic-gradient(from 225deg, rgba(244,241,234,0.35) 0deg 1.2deg, transparent 1.2deg 13.5deg); -webkit-mask-image: radial-gradient(circle, transparent 88%, #000 89%); mask-image: radial-gradient(circle, transparent 88%, #000 89%)"></div>
        <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center">
          <span style="font-size: 12px; font-weight: 800; letter-spacing: 0.24em; color: #9AA3B2">SCORE</span>
          <span style="font-family: 'Anton', sans-serif; font-size: 92px; line-height: 1; color: {{band.color}}">{{score}}</span>
          <span style="font-size: 13px; font-weight: 800; letter-spacing: 0.14em; color: #9AA3B2">/ 100</span>
        </div>
      </div>
    </div>

    <sc-for list="{{rightDials}}" as="d" hint-placeholder-count="2">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 12px">
        <div style="position: relative; width: 168px; height: 168px">
          <div aria-hidden="true" style="position: absolute; inset: 0; border-radius: 50%; background: {{d.ring}}"></div>
          <div aria-hidden="true" style="position: absolute; inset: 12px; border-radius: 50%; background: #0E1219"></div>
          <div aria-hidden="true" style="position: absolute; inset: 18px; border-radius: 50%; background: repeating-conic-gradient(from 225deg, rgba(244,241,234,0.3) 0deg 1.5deg, transparent 1.5deg 27deg); -webkit-mask-image: radial-gradient(circle, transparent 86%, #000 87%); mask-image: radial-gradient(circle, transparent 86%, #000 87%)"></div>
          <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
            <span aria-hidden="true" style="width: 22px; height: 22px; color: {{d.lampColor}}; opacity: {{d.lampOp}}">
              <sc-if value="{{d.isLane}}" hint-placeholder-val="{{ true }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3v4"></path><path d="M5 10v4"></path><path d="M5 17v4"></path><path d="M19 3v18"></path><path d="M9 16l6-8"></path><path d="M11 8h4v4"></path></svg></sc-if>
              <sc-if value="{{d.isGlass}}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12l-1.5 8a4.5 4.5 0 0 1-9 0L6 3z"></path><path d="M12 15.5V21"></path><path d="M8 21h8"></path></svg></sc-if>
            </span>
            <span style="font-family: 'Anton', sans-serif; font-size: {{d.size}}; line-height: 1.05; color: {{d.valueColor}}">{{d.value}}</span>
          </div>
        </div>
        <span style="font-size: 12px; font-weight: 800; letter-spacing: 0.2em; color: #9AA3B2">{{d.label}}</span>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; right: 48px; top: 622px; display: flex; justify-content: space-between; align-items: center; margin-left: 0px; margin-right: 0px">
    
    <div style="display: flex; gap: 14px">
      <button onClick="{{home}}" onMouseEnter="{{hoverHome}}" onMouseLeave="{{unhover}}" onFocus="{{hoverHome}}" onBlur="{{unhover}}" style="height: 60px; padding: 0 28px; border-radius: 18px; border: 1.5px solid {{homeBorder}}; background: rgba(8,10,14,0.92); color: #F4F1EA; font-family: 'Archivo', sans-serif; font-size: 15px; font-weight: 600; letter-spacing: 0.06em; cursor: pointer; outline: none; transition: transform 120ms ease, box-shadow 120ms ease, border-color 120ms ease; transform: {{homeT}}; box-shadow: {{homeS}}">HOME</button>
      <button onClick="{{again}}" onMouseEnter="{{hoverAgain}}" onMouseLeave="{{unhover}}" onFocus="{{hoverAgain}}" onBlur="{{unhover}}" style="display: flex; align-items: center; gap: 14px; height: 60px; padding: 0 26px 0 32px; border: 0; border-radius: 18px; background: #C6FF4A; color: #0B0E14; font-family: 'Archivo', sans-serif; font-size: 18px; font-weight: 800; letter-spacing: 0.04em; cursor: pointer; outline: none; transition: transform 120ms ease, box-shadow 120ms ease; transform: {{againT}}; box-shadow: {{againS}}">
        DRIVE AGAIN
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.5-5.8"></path><path d="M4 4v5h5"></path></svg>
      </button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"collisions":{"editor":"int","default":3,"min":0,"max":12,"section":"Drive result"},"laneExits":{"editor":"int","default":2,"min":0,"max":12,"section":"Drive result"},"driveTime":{"editor":"text","default":"02:47","section":"Drive result"},"level":{"editor":"float","default":0.5,"min":0,"max":3,"step":0.1,"section":"Drive result"},"time":{"editor":"enum","options":["morning","sunset","night"],"default":"night","section":"Drive result"},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { hov: false };
  }
  renderVals() {
    const c = this.props.collisions ?? 3;
    const l = this.props.laneExits ?? 2;
    const t = this.props.driveTime || '02:47';
    const lvl = this.props.level ?? 0.5;
    const tod = this.props.time || 'night';
    // Same formula as GameDataTransfer.CalculateScore()
    const score = 100 - c * 10 - l * 5;
    const BANDS = [
      { min: 90, color: '#C6FF4A', glow: 'rgba(198,255,74,0.25)', title: 'SMOOTH DRIVE.', text: 'You made it home clean — this time. Even a little alcohol slows your reactions.' },
      { min: 70, color: '#FFB020', glow: 'rgba(255,176,32,0.25)', title: 'A FEW CLOSE CALLS.', text: 'Some mistakes on the road. On a real street, any one of them could have been a crash.' },
      { min: 40, color: '#EE5A2C', glow: 'rgba(238,90,44,0.28)', title: 'RISKY DRIVE.', text: 'You lost control more than once. This is exactly how accidents happen.' },
      { min: -9999, color: '#FF4D4D', glow: 'rgba(255,77,77,0.3)', title: 'YOU WOULDN’T HAVE MADE IT HOME.', text: 'Too many crashes. If you drink, take a cab or call a friend.' }
    ];
    const band = BANDS.find((b) => score >= b.min);
    const arc = (frac, color, track) => {
      const deg = Math.max(0, Math.min(1, frac)) * 270;
      return 'conic-gradient(from 225deg, ' + color + ' 0deg ' + deg.toFixed(1) + 'deg, ' + (track || '#232A36') + ' ' + deg.toFixed(1) + 'deg 270deg, transparent 270deg 360deg)';
    };
    const parts = t.split(':');
    const secs = (parseInt(parts[0], 10) || 0) * 60 + (parseInt(parts[1], 10) || 0);
    const zoneColor = lvl >= 1.2 ? '#FF4D4D' : lvl >= 0.9 ? '#EE5A2C' : lvl >= 0.6 ? '#E08A1E' : lvl >= 0.3 ? '#B8952E' : '#9AA3B2';
    const dial = (o) => Object.assign({ isTime: false, isWarn: false, isLane: false, isGlass: false, size: '46px' }, o);
    return {
      bg: { morning: './assets/bc9db980e6bd88d1d04ebc5c25296f87.jpg', sunset: './assets/6923392ced0b7ce0b592752793bb93e8.jpg', night: './assets/e3cccc54f8e8f7eec9db0c18ef3054b3.jpg' }[tod],
      timeLabel: tod === 'sunset' ? 'EVENING' : tod.toUpperCase(), levelText: lvl.toFixed(1),
      band: band, score: score,
      scoreRing: arc(score / 100, band.color),
      leftDials: [
        dial({ label: 'DRIVE TIME', value: t, size: '38px', isTime: true, ring: arc(secs / 300, '#9AA3B2'), lampColor: '#F4F1EA', lampOp: 0.7, valueColor: '#F4F1EA' }),
        dial({ label: 'COLLISIONS', value: c, isWarn: true, ring: arc(c / 10, '#FF4D4D'), lampColor: '#FF4D4D', lampOp: c > 0 ? 1 : 0.25, valueColor: c > 0 ? '#FF4D4D' : '#F4F1EA' })
      ],
      rightDials: [
        dial({ label: 'LANE EXITS', value: l, isLane: true, ring: arc(l / 10, '#FFB020'), lampColor: '#FFB020', lampOp: l > 0 ? 1 : 0.25, valueColor: l > 0 ? '#FFB020' : '#F4F1EA' }),
        dial({ label: 'ALCOHOL LEVEL', value: lvl.toFixed(1), isGlass: true, ring: arc(lvl / 1.5, zoneColor), lampColor: zoneColor, lampOp: lvl >= 0.3 ? 1 : 0.35, valueColor: zoneColor === '#9AA3B2' ? '#F4F1EA' : zoneColor })
      ],
      breakdown: '100 − ' + c + ' × 10 (collisions) − ' + l + ' × 5 (lane exits) = ' + score,
      againT: this.state.hov === 'again' ? 'translate(4px, 5px)' : 'translate(0px, 0px)',
      againS: this.state.hov === 'again' ? 'inset 0 3px 0 rgba(0,0,0,0.28)' : '4px 5px 0 rgba(0,0,0,0.65)',
      homeT: this.state.hov === 'home' ? 'translate(4px, 5px)' : 'translate(0px, 0px)',
      homeS: this.state.hov === 'home' ? 'inset 0 3px 0 rgba(0,0,0,0.28)' : '4px 5px 0 rgba(0,0,0,0.65)',
      homeBorder: this.state.hov === 'home' ? '#C6FF4A' : 'rgba(244,241,234,0.9)',
      hoverAgain: () => this.setState({ hov: 'again' }),
      hoverHome: () => this.setState({ hov: 'home' }),
      unhover: () => this.setState({ hov: null }),
      home: () => { if (this.props.onHome) this.props.onHome(); },
      again: () => { if (this.props.onAgain) this.props.onAgain(); }
    };
  }
}
</script>
</body>
</html>
